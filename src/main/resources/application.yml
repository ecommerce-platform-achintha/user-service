server:
  port: 8081

spring:
  application:
    name: user-service
  config:
    # "optional:" lets the service start even when the Config Server is down.
    # Override with CONFIG_SERVER_URL, e.g. inside Docker where localhost is the container.
    # The JWT signing secret (security.jwt.secret) is supplied by the Config Server
    # (config-repo/user-service.yml); there is deliberately no local default, so the
    # service refuses to start without it.
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:userdb}
    username: ${DB_USERNAME:userservice}
    password: ${DB_PASSWORD:userservice}
  jpa:
    # Temporary: schema managed by Hibernate until Flyway/Liquibase migrations are introduced.
    hibernate:
      ddl-auto: update
    open-in-view: false

security:
  jwt:
    issuer: user-service
    access-token-ttl: 15m

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
